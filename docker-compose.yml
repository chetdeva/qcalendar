# Run the whole system locally:
#
#   docker compose up --build            first run builds the four images (a few minutes)
#   docker compose up -d --build         same, in the background; then `docker compose logs -f`
#   docker compose down                  stop (keeps the calendar data)   |   down -v  also wipes the calendar data
#
# Open http://localhost:3004 (home), http://localhost:3002 (calendar), http://localhost:3005 (chat), http://localhost:3006 (dashboard) or http://localhost:3003 (accounts).
# Ports: home-ui 3004, calendar-service 3000, calendar-ui 3002, users-ui 3003, users-service 3010, chat-ui 3005, dashboard-ui 3006 (chat-service 3001 and dashboard-service 3007, internal). Stop any `npm run dev` servers on those ports first.
#
# Needs: .env at the repo root (SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY, see .env.example) and users-service/.env
# (it holds the Supabase SECRET key, which stays out of the images). Login still goes through your real Supabase
# project, so http://localhost:3002/** and http://localhost:3003/** must be in its redirect URLs.
name: syncschedule

x-supabase-public: &supabase-public
  NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in .env}

services:
  users-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { APP: users-service } }
    env_file:
      - path: users-service/.env # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
        required: false
    environment:
      PORT: "3010"
      INVITE_REDIRECT_URL: http://localhost:3003/accept-invite # opened in the browser, so localhost, not a container name
      SERVICE_API_KEY: ${USERS_SERVICE_API_KEY:-} # lets dashboard-service read a student's guardian email (empty = that endpoint is off)
    ports: ["3010:3010"]

  calendar-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { APP: calendar-service } }
    environment:
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      DATABASE_URL: ${DATABASE_URL:-} # empty = an embedded Postgres in the calendar-data volume
      PGLITE_DIR: /data/pglite
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      SMTP_URL: ${SMTP_URL:-} # empty = invitation emails are only logged
      MAIL_FROM: ${MAIL_FROM:-SyncSchedule <no-reply@localhost>}
      CALENDAR_URL: http://localhost:3002
    volumes: [calendar-data:/data]
    ports: ["3000:3000"]

  users-ui:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        <<: *supabase-public
        APP: users-ui
        NEXT_PUBLIC_ALLOWED_RETURN_ORIGINS: http://localhost:3002,http://localhost:3005,http://localhost:3006
        NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3006 # where people land after logging in
        NEXT_PUBLIC_CALENDAR_URL: http://localhost:3002
        NEXT_PUBLIC_USERS_UI_URL: http://localhost:3003
        NEXT_PUBLIC_CHAT_URL: http://localhost:3005
        NEXT_PUBLIC_HOME_URL: http://localhost:3004 # "Back to Website" on the sign-in pages
    environment:
      USERS_SERVICE_URL: http://users-service:3010 # server to server, over the compose network
    depends_on: [users-service]
    ports: ["3003:3003"]

  calendar-ui:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        <<: *supabase-public
        APP: calendar-ui
        NEXT_PUBLIC_USERS_UI_URL: http://localhost:3003
        NEXT_PUBLIC_CHAT_URL: http://localhost:3005
        NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3006
        NEXT_PUBLIC_CALENDAR_URL: http://localhost:3002
    environment:
      CALENDAR_API_URL: http://calendar-service:3000
      USERS_SERVICE_URL: http://users-service:3010
      CHAT_API_URL: http://chat-service:3001 # a decline or a time-change request also messages the teacher
    depends_on: [calendar-service, users-service, chat-service]
    ports: ["3002:3002"]

  chat-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { APP: chat-service } }
    environment:
      PORT: "3001"
      SUPABASE_URL: ${SUPABASE_URL}
      DATABASE_URL: ${DATABASE_URL:-} # empty = an embedded Postgres in the chat-data volume
      PGLITE_DIR: /data/pglite
      CHAT_POLICY_URL: http://calendar-service:3000/v1/chat-policy # who may talk is decided by calendar-service (a shared class)
    volumes: [chat-data:/data]
    depends_on: [calendar-service]

  chat-ui:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        <<: *supabase-public
        APP: chat-ui
        NEXT_PUBLIC_USERS_UI_URL: http://localhost:3003
        NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3006
        NEXT_PUBLIC_CALENDAR_URL: http://localhost:3002
        NEXT_PUBLIC_CHAT_URL: http://localhost:3005
    environment:
      CHAT_API_URL: http://chat-service:3001
      CALENDAR_API_URL: http://calendar-service:3000
      USERS_SERVICE_URL: http://users-service:3010
    depends_on: [chat-service, calendar-service, users-service]
    ports: ["3005:3005"]

  dashboard-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { APP: dashboard-service } }
    environment:
      PORT: "3007"
      SUPABASE_URL: ${SUPABASE_URL}
      DATABASE_URL: ${DATABASE_URL:-} # empty = an embedded Postgres in the dashboard-data volume
      PGLITE_DIR: /data/pglite
      CALENDAR_API_URL: http://calendar-service:3000 # classes and who may be assigned work
      USERS_SERVICE_URL: http://users-service:3010 # names, and the guardian's email for the parent-sync message
      USERS_SERVICE_API_KEY: ${USERS_SERVICE_API_KEY:-} # shared secret with users-service; empty = grades publish but parents are not emailed
      SMTP_URL: ${SMTP_URL:-} # empty = parent emails are only logged
      MAIL_FROM: ${MAIL_FROM:-Quanttoria <no-reply@localhost>}
      DASHBOARD_URL: http://localhost:3006
    volumes: [dashboard-data:/data]
    depends_on: [calendar-service, users-service]

  dashboard-ui:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        <<: *supabase-public
        APP: dashboard-ui
        NEXT_PUBLIC_USERS_UI_URL: http://localhost:3003
        NEXT_PUBLIC_CALENDAR_URL: http://localhost:3002
        NEXT_PUBLIC_CHAT_URL: http://localhost:3005
        NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3006
    environment:
      DASHBOARD_API_URL: http://dashboard-service:3007
      USERS_SERVICE_URL: http://users-service:3010
    depends_on: [dashboard-service, users-service]
    ports: ["3006:3006"]

  home-ui:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP: home-ui
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3003 # the Login button goes to users-ui (opened in the browser, so localhost)
    depends_on: [users-ui] # so `docker compose up home-ui` also starts the login page
    ports: ["3004:3004"]

volumes:
  calendar-data:
  chat-data:
  dashboard-data:
