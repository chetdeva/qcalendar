# Test, build arm64 images on a GitHub runner, push them to GHCR, then deploy to the EC2 server.
# Run it from the Actions tab ("Run workflow"). Setup and secrets: deploy/README.md, "Deploying from GitHub Actions".
name: Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services to deploy, or "all"'
        default: all
      ref_tag:
        description: 'Redeploy images already built for this git sha (rollback). Empty = build the current commit'
        default: ''

concurrency: deploy-production

permissions:
  contents: read
  packages: write
  id-token: write # AWS OIDC

env:
  ALL: users-service calendar-service billing-service chat-service dashboard-service users-ui calendar-ui chat-ui dashboard-ui home-ui
  AWS_REGION: us-west-1

jobs:
  test:
    if: inputs.ref_tag == ''
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        svc: [users-service, calendar-service, billing-service, chat-service, dashboard-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: mkdir -p data && npm ci && npm test # data/ is git-ignored; calendar-service's migrate test writes a temp database there
        working-directory: ${{ matrix.svc }}

  deploy:
    needs: test
    # run when tests passed, or when the test job was skipped for a rollback
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ inputs.ref_tag || github.sha }}
      SVCS: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick services
        run: |
          case "$SVCS" in all|"") SVCS="$ALL";; esac
          echo "SVCS=$SVCS" >> "$GITHUB_ENV"

      - name: Check the build secrets
        if: inputs.ref_tag == ''
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # these get baked into the web apps; a copied-over quote once broke every sign-in
          [[ "$SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::SUPABASE_URL is not a plain https address (stray quote or space?)"; exit 1; }
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::DOMAIN is not a plain domain"; exit 1; }
          [[ -n "$SUPABASE_PUBLISHABLE_KEY" && "$SUPABASE_PUBLISHABLE_KEY" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::SUPABASE_PUBLISHABLE_KEY is empty or has stray characters"; exit 1; }

      - name: Build and push images
        if: inputs.ref_tag == ''
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          DATABASE_URL: unused-at-build # only needed so compose can parse the file
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -p syncschedule -f docker-compose.yml -f docker-compose.prod.yml build $SVCS
          for s in $SVCS; do
            docker tag syncschedule-$s $IMAGE-$s:$SHA
            # a new package's first push can fail with "unknown blob"; a retry works
            for i in 1 2 3; do docker push $IMAGE-$s:$SHA && break || { [ $i = 3 ] && exit 1; sleep 10; }; done
          done

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Open SSH for this runner
        run: |
          echo "RUNNER_IP=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "${{ secrets.SG_ID }}" --protocol tcp --port 22 \
            --cidr "$(curl -s https://checkip.amazonaws.com)/32"

      - name: Deploy
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 600 /dev/null key && echo "${{ secrets.SSH_PRIVATE_KEY }}" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@$HOST"
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml docker-compose.prod.yml ubuntu@$HOST:app/
          scp -i key -r deploy ubuntu@$HOST:app/
          $SSH "set -e; cd ~/app
            docker image prune -f >/dev/null; df -h / | tail -1
            for s in $SVCS; do
              docker tag syncschedule-\$s syncschedule-\$s:previous 2>/dev/null || true
              docker pull $IMAGE-\$s:$SHA
              docker tag $IMAGE-\$s:$SHA syncschedule-\$s
              docker rmi $IMAGE-\$s:$SHA >/dev/null # the registry name was only for pulling; each sha tag kept a 600 MB copy
            done
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --no-deps $SVCS
            sleep 10; docker ps --format '{{.Names}} {{.Status}}'"

      - name: Check the site
        id: check
        run: |
          curl -fsS --retry 6 --retry-delay 5 -o /dev/null https://www.${{ secrets.DOMAIN }}
          curl -fsS --retry 6 --retry-delay 5 -o /dev/null https://accounts.${{ secrets.DOMAIN }}/login

      - name: Remove old images
        if: success()
        run: ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.SERVER_HOST }} "docker image prune -f" # untagged ones only; :previous and the running images stay

      - name: Roll back to the previous images
        if: failure() && steps.check.outcome == 'failure'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@$HOST "cd ~/app
            for s in $SVCS; do docker tag syncschedule-\$s:previous syncschedule-\$s; done
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --no-deps $SVCS"

      - name: Close SSH again
        if: always()
        run: |
          [ -n "$RUNNER_IP" ] && aws ec2 revoke-security-group-ingress --group-id "${{ secrets.SG_ID }}" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" || true
